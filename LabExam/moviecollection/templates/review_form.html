{% extends 'base.html' %}
{% block title %}
  Add Review for {{ movie.title }}
{% endblock %}
{% block content %}
  <h2>Review for {{ movie.title }}</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Submit Review</button>
  </form>
{% endblock %}
